# Production (GĐ9.1, ADR-0007): `docker compose up -d --build` ở gốc repo.
# Biến bắt buộc đặt trong `.env` (xem phần "Production" trong .env.example). Mật khẩu chỉ dùng chữ + số
# (VD `openssl rand -hex 32`) vì được ghép thẳng vào URL kết nối.
# Dev hằng ngày vẫn dùng docker-compose.dev.yml + `pnpm dev`.
name: mfg

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pitch_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: pitch
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?đặt APP_DB_PASSWORD trong .env}
    # Không có `ports`: chỉ truy cập trong mạng nội bộ Docker.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pitch_owner -d pitch']
      interval: 5s
      timeout: 3s
      retries: 30

  # Chạy migration + nạp danh mục thẻ bằng quyền chủ DB rồi thoát; server chỉ bật khi bước này xong.
  # Trước khi cập nhật bản có migration mới: `pg_dump` (migration không có bản đảo ngược).
  migrate:
    build: { context: ., target: server }
    image: mfg-server
    restart: 'no'
    command: ['sh', '-c', 'node dist/migrate.js && node dist/seed.js']
    environment:
      DATABASE_URL: postgres://pitch_owner:${POSTGRES_PASSWORD}@postgres:5432/pitch
      SESSION_SECRET: ${SESSION_SECRET:?đặt SESSION_SECRET (≥ 32 ký tự) trong .env}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: mfg-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pitch_app:${APP_DB_PASSWORD}@postgres:5432/pitch
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    build: { context: ., target: web }
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
